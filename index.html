<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>坦克大战</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 shape-rendering=%22crispEdges%22%3E%3Crect x=%221%22 y=%223%22 width=%223%22 height=%2213%22 fill=%22%236b3d00%22/%3E%3Crect x=%2212%22 y=%223%22 width=%223%22 height=%2213%22 fill=%22%236b3d00%22/%3E%3Crect x=%224%22 y=%225%22 width=%228%22 height=%229%22 fill=%22%23e39a1c%22/%3E%3Crect x=%227%22 y=%220%22 width=%222%22 height=%227%22 fill=%22%23ffe08a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage-wrap"><canvas id="screen" width="256" height="240"></canvas></div>

  <div id="touch-ui" hidden>
    <div id="pad" aria-label="方向摇杆"><div id="knob"></div></div>
    <button id="fire" type="button" aria-label="开火">开火</button>
    <button id="pause-btn" type="button" aria-label="暂停">❚❚</button>
  </div>

  <section id="menu" class="overlay">
    <div class="panel">
      <h1 class="logo">坦克大战</h1>
      <p class="sub">BATTLE CITY · 网页复刻版</p>
      <p id="result" class="result" hidden></p>
      <p id="who" class="who"></p>
      <div class="btns">
        <button id="btn-continue" type="button" class="primary" hidden></button>
        <button id="btn-new" type="button"></button>
        <button id="btn-board" type="button">排行榜</button>
        <button id="btn-auth" type="button"></button>
        <button id="btn-sound" type="button"></button>
      </div>
      <p class="help" id="help-keys">电脑：方向键 / WASD 移动，空格 / J 开火，P 暂停</p>
      <p class="help" id="help-touch">手机：横竖屏都能玩，左边摇杆移动，右边按钮开火</p>
    </div>
  </section>

  <section id="auth" class="overlay" hidden>
    <form class="panel" id="auth-form" autocomplete="on">
      <h2 id="auth-title">登录</h2>
      <label for="nick">昵称</label>
      <input id="nick" name="username" autocomplete="username" maxlength="12" required>
      <label for="pw">密码</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <p id="auth-err" class="err" hidden></p>
      <div class="btns">
        <button type="submit" class="primary" id="auth-submit">登录</button>
        <button type="button" id="auth-switch">没有账号？注册一个</button>
        <button type="button" class="back">返回</button>
      </div>
      <p class="help">忘记密码请找<span id="admin-name"></span>重置</p>
    </form>
  </section>

  <section id="board" class="overlay" hidden>
    <div class="panel wide">
      <h2>排行榜</h2>
      <p class="help">每人只记最高的一局</p>
      <div class="table-wrap"><table>
        <thead><tr><th>名次</th><th>昵称</th><th>分数</th><th>关数</th><th>日期</th></tr></thead>
        <tbody id="board-rows"></tbody>
      </table></div>
      <p id="board-me" class="who" hidden></p>
      <div class="btns"><button type="button" class="back">返回</button></div>
    </div>
  </section>

  <section id="paused" class="overlay" hidden>
    <div class="panel">
      <h2>暂停</h2>
      <div class="btns">
        <button type="button" class="primary" id="btn-resume">继续</button>
        <button type="button" id="btn-quit">回到菜单</button>
      </div>
      <p class="help" id="quit-note"></p>
    </div>
  </section>

  <section id="dialog" class="overlay top" hidden>
    <div class="panel">
      <p id="dialog-msg"></p>
      <div class="btns" id="dialog-btns"></div>
    </div>
  </section>

  <div id="toast" role="status" hidden></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
