<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 shape-rendering=%22crispEdges%22%3E%3Crect x=%221%22 y=%223%22 width=%223%22 height=%2213%22 fill=%22%236b3d00%22/%3E%3Crect x=%2212%22 y=%223%22 width=%223%22 height=%2213%22 fill=%22%236b3d00%22/%3E%3Crect x=%224%22 y=%225%22 width=%228%22 height=%229%22 fill=%22%23e39a1c%22/%3E%3Crect x=%227%22 y=%220%22 width=%222%22 height=%227%22 fill=%22%23ffe08a%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #141414; --panel: #0b0b0b; --brick: #a8541c; --brick-dark: #6e2e08;
    --gold: #e39a1c; --gold-light: #ffe08a; --text: #f2f2f2; --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    padding: max(32px, env(safe-area-inset-top)) 16px 32px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 {
    margin: 0 0 6px; font-size: 36px; letter-spacing: .08em; color: var(--gold);
    text-shadow: 3px 3px 0 var(--brick-dark), -1px -1px 0 var(--gold-light);
  }
  .sub { margin: 0 0 28px; color: var(--muted); font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
  a.game {
    display: block; padding: 16px 18px; text-decoration: none; color: inherit;
    background: var(--panel); border: 4px solid var(--brick);
    box-shadow: 0 0 0 4px var(--brick-dark), 6px 6px 0 4px #000;
  }
  a.game:hover, a.game:focus-visible { border-color: var(--gold); outline: none; }
  a.game:active { transform: translate(1px, 1px); }
  .name { font-size: 20px; color: var(--gold-light); }
  .desc { margin-top: 6px; font-size: 14px; color: var(--muted); line-height: 1.6; }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>小游戏</h1>
  <p class="sub">点开就能玩，电脑和手机都行</p>
  <ul>
    <li><a class="game" href="tank-battle/">
      <div class="name">坦克大战</div>
      <div class="desc">照着 FC 版复刻，35 关，单人闯关，有存档和排行榜。</div>
    </a></li>
  </ul>
  <footer>在微信里打不开的话，点右上角菜单，选"在浏览器打开"。</footer>
</main>
</body>
</html>
